[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Kaeso only verifies RSA signatures with public keys: OIDC ID tokens in the gateway and Sigstore bundles in the updater. RSA private-key operations, which the Marvin attack targets, run only in the test kit's mock identity provider, and no fixed version of rsa exists" },
  { id = "RUSTSEC-2026-0387", reason = "Only crypto-bigint 0.5, through openidconnect's p256 and p384 0.13, is still affected, and openidconnect uses them only to verify ES256 and ES384 ID-token signatures against the identity provider's public keys, so no secret goes through the affected arithmetic. Kaeso's own p256 is 0.14 on crypto-bigint 0.7.6, and no fixed 0.5 release exists" },
  { id = "GHSA-qwgh-2vcv-g2f7", reason = "Only block-buffer 0.10.4, through digest 0.10.7, falls in the advisory's range, and it keeps the cursor in a separate pos field that input data never overwrites, so a caught panic cannot leave it invalid. The inline cursor the advisory corrupts arrived in 0.11, and Kaeso's other block-buffer is the fixed 0.12.1" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
exceptions = [
  { crate = "quoted_printable", allow = ["0BSD"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
  { crate = "xxhash-rust", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
