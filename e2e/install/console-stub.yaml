services:
  console:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    cap_add: [NET_BIND_SERVICE]
    command: ["caddy", "respond", "--listen", ":3000", "--header", "Content-Type: text/html; charset=utf-8", "<!doctype html><title>Kaeso</title>"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 2s
      timeout: 3s
      retries: 30
