services:
  caddy-init:
    profiles: [compose-edge]

  caddy:
    profiles: [compose-edge]

  edge:
    image: ${KAESO_TEST_CONSOLE_IMAGE}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:mode=1777", "/var/lib/console/data:mode=1777", "/var/lib/console/config:mode=1777"]
    command: ["kaeso-edge"]
    environment:
      PORT: "8080"
      KAESO_GATEWAY_UPSTREAM: gateway:8080
      KAESO_CONSOLE_UPSTREAM: console:3000
      KAESO_EDGE_TRUSTED_PROXIES: ${KAESO_TEST_EDGE_TRUSTED_PROXIES:-198.51.100.0/24}
    ports:
      - "127.0.0.1:${KAESO_TEST_PORT}:8080"
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/kaeso-edge/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
    depends_on:
      gateway:
        condition: service_healthy
      console:
        condition: service_healthy

  gateway:
    image: ${KAESO_TEST_GATEWAY_IMAGE}
    environment:
      KAESO_PUBLIC_URL: http://localhost:${KAESO_TEST_PORT}
      KAESO_MAIL_TRANSPORT: log
      KAESO_SMTP_FROM: Kaeso <kaeso@example.com>
      KAESO_KPMR_SYNC: "false"
      KAESO_UPDATES_CHECK: "false"
      KAESO_PROVIDERS_OPENAI_BASE_URL: http://mock:8080
      KAESO_PROVIDERS_ANTHROPIC_BASE_URL: http://mock:8080
    networks: [edge, data, updates, providers]

  console:
    image: ${KAESO_TEST_CONSOLE_IMAGE}

  mock:
    image: ${KAESO_TEST_MOCK_IMAGE}
    networks: [providers]

networks:
  providers:
    internal: true
