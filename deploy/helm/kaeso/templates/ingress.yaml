{{- if .Values.ingress.enabled }}
{{- $fullname := include "kaeso.fullname" . }}
{{- $host := include "kaeso.host" . }}
{{- $nginx := contains "nginx" .Values.ingress.className }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kaeso.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.certManager.issuer }}
    {{- if eq .Values.ingress.tls.certManager.kind "Issuer" }}
    cert-manager.io/issuer: {{ .Values.ingress.tls.certManager.issuer | quote }}
    {{- else }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManager.issuer | quote }}
    {{- end }}
    {{- end }}
    {{- if $nginx }}
    # Streams can be silent for minutes, and images and audio are large: ingress-nginx's
    # defaults of 60 seconds and 1 MiB would cut them.
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.streamTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.streamTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ default (printf "%s-tls" $fullname) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range include "kaeso.gatewayPaths" . | fromJsonArray }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-gateway
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-console
                port:
                  name: http
{{- end }}
