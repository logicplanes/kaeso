{{- if or (not .Values.masterKeys.existingSecret) .Values.bundled.enabled }}
{{- $root := . }}
{{- $host := include "kaeso.fullname" . }}
{{/*
A hook, so the migration Job finds it before the release's other resources exist. Hooks aren't
part of the release, so `helm uninstall` leaves it: the master keys outlive a reinstall.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaeso.generatedSecret" . }}
  labels:
    {{- include "kaeso.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if not .Values.masterKeys.existingSecret }}
  master-keys: {{ include "kaeso.generated" (dict "root" $root "key" "master-keys" "new" (printf "k%s:%s" (randAlphaNum 10 | lower) (randBytes 32))) | quote }}
  {{- end }}
  {{- if .Values.bundled.enabled }}
  {{- $postgres := include "kaeso.generated" (dict "root" $root "key" "postgres-password" "new" (randAlphaNum 32)) }}
  {{- $clickhouse := include "kaeso.generated" (dict "root" $root "key" "clickhouse-password" "new" (randAlphaNum 32)) }}
  {{- $valkey := include "kaeso.generated" (dict "root" $root "key" "valkey-password" "new" (randAlphaNum 32)) }}
  postgres-password: {{ $postgres | quote }}
  postgres-superuser-password: {{ include "kaeso.generated" (dict "root" $root "key" "postgres-superuser-password" "new" (randAlphaNum 32)) | quote }}
  clickhouse-password: {{ $clickhouse | quote }}
  valkey-password: {{ $valkey | quote }}
  postgres-url: {{ printf "postgres://kaeso:%s@%s-postgres:5432/kaeso" $postgres $host | quote }}
  clickhouse-url: {{ printf "http://kaeso:%s@%s-clickhouse:8123" $clickhouse $host | quote }}
  valkey-url: {{ printf "redis://:%s@%s-valkey:6379" $valkey $host | quote }}
  {{- end }}
{{- end }}
