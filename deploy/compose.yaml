name: kaeso

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      KAESO_DOMAIN: ${KAESO_DOMAIN:?set KAESO_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      gateway:
        condition: service_healthy
      console:
        condition: service_healthy

  gateway:
    image: ghcr.io/logicplanes/kaeso-gateway:0.1.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    environment:
      KAESO_PUBLIC_URL: ${KAESO_PUBLIC_URL:-https://${KAESO_DOMAIN:?set KAESO_DOMAIN in .env}}
      KAESO_POSTGRES_URL: postgres://kaeso:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/kaeso
      KAESO_CLICKHOUSE_URL: http://kaeso:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}@clickhouse:8123
      KAESO_VALKEY_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379
      KAESO_MASTER_KEYS_FILE: /run/secrets/master_keys
      KAESO_MAIL_TRANSPORT: ${KAESO_MAIL_TRANSPORT:-smtp}
      KAESO_SMTP_HOST: ${KAESO_SMTP_HOST:-}
      KAESO_SMTP_PORT: ${KAESO_SMTP_PORT:-587}
      KAESO_SMTP_TLS: ${KAESO_SMTP_TLS:-starttls}
      KAESO_SMTP_USER: ${KAESO_SMTP_USER:-}
      KAESO_SMTP_PASSWORD: ${KAESO_SMTP_PASSWORD:-}
      KAESO_SMTP_FROM: ${KAESO_SMTP_FROM:-Kaeso <kaeso@${KAESO_DOMAIN}>}
      KAESO_LOG_FORMAT: json
    secrets: [master_keys]
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_started

  console:
    image: ghcr.io/logicplanes/kaeso-console:0.1.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [edge]

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      KAESO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/kaeso.sh
    volumes:
      - postgres:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "kaeso", "-d", "kaeso"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.48.2-alpine@sha256:7b4bac0d6d220bcc182fa1d781c177c21639edb02b354a232373fe93d2f1d863
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      CLICKHOUSE_USER: kaeso
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: kaeso
    volumes:
      - clickhouse:/var/lib/clickhouse
    networks: [data]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD}"]
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD}
    volumes:
      - valkey:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

configs:
  postgres_init:
    content: |
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" -v password="$$KAESO_POSTGRES_PASSWORD" <<'SQL'
      CREATE ROLE kaeso LOGIN PASSWORD :'password';
      CREATE DATABASE kaeso OWNER kaeso;
      SQL
  caddyfile:
    content: |
      {$$KAESO_DOMAIN} {
      	header {
      		Strict-Transport-Security "max-age=31536000"
      		-Server
      	}
      	@api path /v1/* /platform/*
      	handle @api {
      		reverse_proxy gateway:8080 {
      			flush_interval -1
      		}
      	}
      	handle {
      		reverse_proxy console:3000
      	}
      }

secrets:
  master_keys:
    file: ./master-keys

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres:
  clickhouse:
  valkey:
