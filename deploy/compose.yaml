name: kaeso

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      gateway:
        condition: service_healthy
      console:
        condition: service_healthy

  gateway:
    image: ghcr.io/logicplanes/kaeso-gateway:0.1.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      KAESO_PUBLIC_URL: ${KAESO_PUBLIC_URL:-https://${KAESO_DOMAIN:?set KAESO_DOMAIN in .env}}
      KAESO_POSTGRES_URL: postgres://kaeso:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/kaeso
      KAESO_CLICKHOUSE_URL: http://kaeso:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}@clickhouse:8123
      KAESO_VALKEY_URL: redis://valkey:6379
      KAESO_MASTER_KEYS_FILE: /run/secrets/master_keys
      KAESO_MAIL_TRANSPORT: ${KAESO_MAIL_TRANSPORT:-smtp}
      KAESO_SMTP_HOST: ${KAESO_SMTP_HOST:-}
      KAESO_SMTP_PORT: ${KAESO_SMTP_PORT:-587}
      KAESO_SMTP_TLS: ${KAESO_SMTP_TLS:-starttls}
      KAESO_SMTP_USER: ${KAESO_SMTP_USER:-}
      KAESO_SMTP_PASSWORD: ${KAESO_SMTP_PASSWORD:-}
      KAESO_SMTP_FROM: ${KAESO_SMTP_FROM:-Kaeso <kaeso@${KAESO_DOMAIN}>}
      KAESO_LOG_FORMAT: json
    secrets: [master_keys]
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_started

  console:
    image: ghcr.io/logicplanes/kaeso-console:0.1.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      KAESO_PUBLIC_URL: ${KAESO_PUBLIC_URL:-https://${KAESO_DOMAIN}}
    networks: [edge]

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: kaeso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kaeso
    volumes:
      - postgres:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kaeso"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.49.3-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      CLICKHOUSE_USER: kaeso
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: kaeso
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse:/var/lib/clickhouse
    networks: [data]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

configs:
  caddyfile:
    content: |
      ${KAESO_DOMAIN} {
      	@api path /v1/* /platform/*
      	handle @api {
      		reverse_proxy gateway:8080 {
      			flush_interval -1
      		}
      	}
      	handle {
      		reverse_proxy console:3000
      	}
      }

secrets:
  master_keys:
    file: ./master-keys

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres:
  clickhouse:
  valkey:
