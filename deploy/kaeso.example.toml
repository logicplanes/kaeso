listen = "0.0.0.0:8080"
metrics_listen = "127.0.0.1:9100"
public_url = "https://kaeso.example.com"
trusted_proxies = "127.0.0.0/8,::1/128"
shutdown_grace = "30s"

[server]
header_read_timeout = "30s"
body_read_timeout = "30s"
body_read_deadline = "60s"
max_connections = 4096

[cors]
allowed_origins = ""

[postgres]
pool_size = 20

[clickhouse]
database = "kaeso"

[valkey]
key_prefix = "kaeso:"
ca = ""

[setup]
email = ""

[smtp]
host = "smtp.example.com"
port = 587
tls = "starttls"
user = "kaeso"
from = "Kaeso <kaeso@localhost>"

[mail]
transport = "smtp"

[auth]
password = true
magic_link = true
demo_user = ""
oidc_allow_private_networks = false

[legal]
imprint_url = ""
privacy_url = ""

[key_failures]
per_address = 100
window = "1m"

[kpmr]
sync = true
url = "https://kpmr.kaeso.app/v1/catalogue"
interval = "auto"
public_keys = ""

[updates]
check = true
channel = "stable"
mode = "manual"
releases_url = "https://update.kaeso.app/v1/releases.json"

[updater]
url = "http://updater:8081"

[providers.openai]
base_url = "https://api.openai.com"

[providers.anthropic]
base_url = "https://api.anthropic.com"

[providers.deepseek]
base_url = "https://api.deepseek.com"

[providers.xai]
base_url = "https://api.x.ai"

[providers.togetherai]
base_url = "https://api.together.ai"

[providers.groq]
base_url = "https://api.groq.com/openai"

[providers.openrouter]
base_url = "https://openrouter.ai/api"

[providers.mistral]
base_url = "https://api.mistral.ai"

[providers.vercel]
base_url = "https://ai-gateway.vercel.sh"

[providers.cohere]
base_url = "https://api.cohere.ai/compatibility"

[providers.ollama-cloud]
base_url = "https://ollama.com"

[providers.moonshotai]
base_url = "https://api.moonshot.ai"

[providers.alibaba]
base_url = "https://ap-southeast-1.maas.qwencloudapi.com/compatible-mode"

[providers.cerebras]
base_url = "https://api.cerebras.ai"

[providers.zai]
base_url = "https://api.z.ai/api/anthropic"

[providers.minimax]
base_url = "https://api.minimax.io/anthropic"

[providers.elevenlabs]
base_url = "https://api.elevenlabs.io"

[providers.google]
base_url = "https://generativelanguage.googleapis.com"

[providers.gemini-agent-platform]
base_url = "https://aiplatform.googleapis.com"

[providers.fireworks-ai]
base_url = "https://api.fireworks.ai/inference"

[providers.nebius]
base_url = "https://api.tokenfactory.nebius.com"

[providers.sambanova]
base_url = "https://api.sambanova.ai"

[providers.scaleway]
base_url = "https://api.scaleway.ai"

[providers.huggingface]
base_url = "https://router.huggingface.co"

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com"

[providers.baseten]
base_url = "https://inference.baseten.co"

[providers.siliconflow]
base_url = "https://api.siliconflow.com"

[providers.standardcompute]
base_url = "https://api.stdcmpt.com"

[providers.cloudflare-ai-gateway]
base_url = "https://api.cloudflare.com"

[custom_providers]
enabled = true
allowed_networks = ""

[mcp_servers]
allowed_networks = ""
sync_interval = "15m"

[mcp_portal]
response_limit = "4MiB"
call_timeout = "60s"

[upstream]
connect_timeout = "10s"
request_timeout = "600s"
first_byte_timeout = "60s"
stream_idle_timeout = "300s"

[streams]
keepalive_interval = "15s"
max_duration = "0s"
max_bytes = "0"

[continuity]
reasoning_ttl = "1h"

[response_cache]
enabled = true
max_entry_size = "1MiB"
memory_share = 50

[body_limits]
model_api = "32MiB"
images = "64MiB"
audio = "26MiB"
in_flight = "512MiB"
platform_api = "1MiB"
provider_response = "128MiB"

[logs]
buffer_size = "256MiB"
flush_interval = "1s"
flush_rows = 5000

[instance]
org_creation = "instance_admins"
account_creation = "invitation_only"
metadata_retention_days = 90
content_retention_days = 30
max_metadata_retention_days = 3650
max_content_retention_days = 3650
org_deletion = true
org_deletion_grace_days = 7
timezone = "UTC"

[log]
level = "info,sqlx=warn"
format = "json"
