listen = "0.0.0.0:8080"
metrics_listen = "0.0.0.0:9100"
public_url = "https://kaeso.example.com"
trusted_proxies = "127.0.0.0/8,::1/128"
shutdown_grace = "30s"

[server]
header_read_timeout = "30s"
body_read_timeout = "30s"

[cors]
allowed_origins = ""

[postgres]
pool_size = 20

[clickhouse]
database = "kaeso"

[valkey]
key_prefix = "kaeso:"

[smtp]
host = "smtp.example.com"
port = 587
tls = "starttls"
user = "kaeso"
from = "Kaeso <kaeso@localhost>"

[mail]
transport = "smtp"

[auth]
password = true
magic_link = true
oidc = true
oidc_allow_private_networks = false

[key_failures]
per_address = 100
window = "1m"

[models_dev]
sync = true
url = "https://models.dev/api.json"
interval = "24h"

[updates]
check = true
channel = "stable"
mode = "manual"
releases_url = "https://update.kaeso.app/v1/releases.json"

[updater]
url = "http://updater:8081"

[providers.openai]
base_url = "https://api.openai.com"

[providers.anthropic]
base_url = "https://api.anthropic.com"

[providers.deepseek]
base_url = "https://api.deepseek.com"
[providers.mistral]
base_url = "https://api.mistral.ai"

[providers.xai]
base_url = "https://api.x.ai"

[providers.togetherai]
base_url = "https://api.together.ai"

[providers.groq]
base_url = "https://api.groq.com/openai"

[providers.openrouter]
base_url = "https://openrouter.ai/api"

[upstream]
connect_timeout = "10s"
request_timeout = "600s"
first_byte_timeout = "60s"
stream_idle_timeout = "300s"

[streams]
keepalive_interval = "15s"
max_duration = "0s"
max_bytes = "0"

[continuity]
reasoning_ttl = "1h"

[body_limits]
model_api = "32MiB"
platform_api = "1MiB"
provider_response = "128MiB"

[logs]
buffer_size = "256MiB"
flush_interval = "1s"
flush_rows = 5000

[instance]
org_creation = "instance_admins"
account_creation = "invitation_only"
metadata_retention_days = 90
content_retention_days = 30
max_metadata_retention_days = 3650
max_content_retention_days = 3650
org_deletion = true
org_deletion_grace_days = 7
timezone = "UTC"

[log]
level = "info,sqlx=warn"
format = "json"
