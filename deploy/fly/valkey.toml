# Valkey for Kaeso on Fly.io, on a volume and reachable only over the organization's private network.
# Docs: https://docs.kaeso.app/self-hosting/platforms/fly
primary_region = "fra"

[build]
  image = "valkey/valkey:9.1.3-alpine"

[experimental]
  # Through a shell for the password from the app's secret, then the image's entrypoint, which runs Valkey as
  # its own user. Half the machine's memory, and never evict, so a full Valkey refuses writes instead of
  # dropping limit counters.
  cmd = ["sh", "-c", "exec docker-entrypoint.sh valkey-server --dir /data --appendonly yes --requirepass \"$VALKEY_PASSWORD\" --maxmemory 256mb --maxmemory-policy noeviction"]

[[mounts]]
  source = "valkey_data"
  destination = "/data"
  initial_size = "1gb"

[checks]
  [checks.valkey]
    type = "tcp"
    port = 6379
    grace_period = "10s"
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
