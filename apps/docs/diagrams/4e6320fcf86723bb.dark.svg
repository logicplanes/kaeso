<svg id="d4e6320fcf86723bb" width="659" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="177" viewBox="4 12 658.47 176.8" role="img" aria-describedby="chart-desc-d4e6320fcf86723bb" aria-labelledby="chart-title-d4e6320fcf86723bb" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.467"><title id="chart-title-d4e6320fcf86723bb">The spans of one model request</title><desc id="chart-desc-d4e6320fcf86723bb">The app's span, named by the traceparent header, is the parent of Kaeso's server span kaeso.request. Under it is a client span for each step that called a provider, in the order they were tried: here a step whose model was overloaded, then the step that answered on another model, which carries the tokens and the content.</desc><g><marker id="d4e6320fcf86723bb_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d4e6320fcf86723bb_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d4e6320fcf86723bb_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="d4e6320fcf86723bb_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" ma