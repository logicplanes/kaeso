<svg id="df5388cd6341d61f4" width="598" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="621" viewBox="4 12 597.95 620.8" role="img" aria-describedby="chart-desc-df5388cd6341d61f4" aria-labelledby="chart-title-df5388cd6341d61f4" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter"><title id="chart-title-df5388cd6341d61f4">How an install learns about releases and updates</title><desc id="chart-desc-df5388cd6341d61f4">The gateway gets the list of releases from update.kaeso.app, keeps its update state in PostgreSQL and starts an update on the updater with a bearer token over the internal network updates. The updater fetches release.json and compose.yaml from github.com, attestations from api.github.com and images from ghcr.io. It reaches the Docker socket only through docker-proxy on the internal network docker, and writes the maintenance flag that Caddy reads to serve the updating page and the JSON 503s.</desc><g><marker id="df5388cd6341d61f4_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><polygon points="0,7 11.5,14 11.5,0" stroke-width="0px"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-circleEnd" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-circleStart" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-circleEnd-margin" viewBox="0 0 10 10" refY="5" refX="12.25" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5" stroke-width="0px"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-circleStart-margin" viewBox="0 0 10 10" refX="-2" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5" stroke-width="0px"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-crossEnd" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 1,1 l 9,9 M 10,1 l -9,9" stroke-width="2px"/></marker><marker id="df5388cd6341d61f4_flowchart-v2-crossStart" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><pa