<svg id="db711819af3b31ec8" width="1027" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="497" viewBox="4 -4 1026.89 496.63" role="img" aria-describedby="chart-desc-db711819af3b31ec8" aria-labelledby="chart-title-db711819af3b31ec8" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.685"><title id="chart-title-db711819af3b31ec8">托管平台上的 Kaeso</title><desc id="chart-desc-db711819af3b31ec8">应用和浏览器通过平台的 TLS 到达一个公开的边缘服务。边缘服务把 API、MCP 服务器及其登录发往私有网关，把其他所有路径发往私有控制台。网关使用平台的 PostgreSQL 和 Valkey，在开启请求日志时使用外部 ClickHouse，并调用模型服务商。</desc><g><marker id="db711819af3b31ec8_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="db711819af3b31ec8_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="db711819af3b31ec8_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="db711819af3b31ec8_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><polygon points="0,7 11.5,14 11.5,0" stroke-width="0px"/></marker><marker