<svg id="d0a1629f511946725" width="1135" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="350" viewBox="4 -4 1135 349.1" role="img" aria-describedby="chart-desc-d0a1629f511946725" aria-labelledby="chart-title-d0a1629f511946725" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.678"><title id="chart-title-d0a1629f511946725">Kubernetes 上的 Kaeso</title><desc id="chart-desc-d0a1629f511946725">应用和浏览器通过 TLS 访问集群的 Ingress 或 Gateway。它把各类 API、MCP 服务器及其登录发往网关 Deployment，其他所有路径发往控制台 Deployment。每次安装和升级在到达网关之前都会先运行迁移 Job。网关使用您自备或 chart 内置的 PostgreSQL、Valkey 和 ClickHouse，调用模型服务商，Prometheus 抓取其指标 Service。</desc><g><marker id="d0a1629f511946725_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d0a1629f511946725_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d0a1629f511946725_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="d0a1629f511946725_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117