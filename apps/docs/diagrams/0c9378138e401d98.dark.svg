<svg id="d0c9378138e401d98" width="765" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="721" viewBox="4 12 764.51 720.41" role="img" aria-describedby="chart-desc-d0c9378138e401d98" aria-labelledby="chart-title-d0c9378138e401d98" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.16"><title id="chart-title-d0c9378138e401d98">How an install learns about releases and updates</title><desc id="chart-desc-d0c9378138e401d98">The gateway gets the list of releases from update.kaeso.app, keeps its update state in PostgreSQL and starts an update on the updater with a bearer token over the internal network updates. The updater fetches release.json and compose.yaml from github.com, attestations from api.github.com and images from ghcr.io. It reaches the Docker socket only through docker-proxy on the internal network docker, as does the compose runner it starts to run Docker Compose with the install's folder read-only. The updater writes the maintenance flag that Caddy reads to serve the updating page and the JSON 503s.</desc><g><marker id="d0c9378138e401d98_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d0c9378138e401d98_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d0c9378138e401d98_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" marker