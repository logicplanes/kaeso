<svg id="d6c26f17f3c84aeeb" width="799" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="726" viewBox="4 12 798.54 725.47" role="img" aria-describedby="chart-desc-d6c26f17f3c84aeeb" aria-labelledby="chart-title-d6c26f17f3c84aeeb" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.157"><title id="chart-title-d6c26f17f3c84aeeb">Wie eine Installation von Releases erfährt und sich aktualisiert</title><desc id="chart-desc-d6c26f17f3c84aeeb">Das Gateway holt die Liste der Releases von update.kaeso.app, hält seinen Update-Zustand in PostgreSQL und startet ein Update beim Updater mit einem Bearer-Token über das interne Netz updates. Der Updater holt release.json und compose.yaml von github.com, Attestierungen von api.github.com und Images von ghcr.io. Er erreicht den Docker-Socket nur über docker-proxy im internen Netz docker, ebenso der Compose-Runner, den er startet, um Docker Compose mit dem schreibgeschützten Ordner der Installation auszuführen. Der Updater schreibt das Wartungs-Flag, das Caddy liest, um die Update-Seite und die JSON-503 auszuliefern.</desc><g><marker id="d6c26f17f3c84aeeb_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d6c26f17f3c84aeeb_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d6c26f17f3c84aeeb_flowchart-v2-pointEnd-margin" viewBox=