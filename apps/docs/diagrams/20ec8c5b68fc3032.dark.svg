<svg id="d20ec8c5b68fc3032" width="768" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="546" viewBox="4 12 767.75 545.9" role="img" aria-describedby="chart-desc-d20ec8c5b68fc3032" aria-labelledby="chart-title-d20ec8c5b68fc3032" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.36"><title id="chart-title-d20ec8c5b68fc3032">The services of a Kaeso install</title><desc id="chart-desc-d20ec8c5b68fc3032">Apps and browsers reach the install only through Caddy, on ports 80 and 443. Caddy sends /v1, /v1beta, /v2, /platform, the MCP server and its OAuth sign-in to the gateway and every other path to the console. PostgreSQL, ClickHouse and Valkey sit on an internal network that only the gateway reaches, and the gateway calls the model providers over HTTPS.</desc><g><marker id="d20ec8c5b68fc3032_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d20ec8c5b68fc3032_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d20ec8c5b68fc3032_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="d20ec8c5b68fc3032_flowchart-v2-pointStart-margin" viewBox="0 