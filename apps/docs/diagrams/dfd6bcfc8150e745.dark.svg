<svg id="ddfd6bcfc8150e745" width="759" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="533" viewBox="4 12 758.25 532.7" role="img" aria-describedby="chart-desc-ddfd6bcfc8150e745" aria-labelledby="chart-title-ddfd6bcfc8150e745" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.364"><title id="chart-title-ddfd6bcfc8150e745">Die Dienste einer Kaeso-Installation</title><desc id="chart-desc-ddfd6bcfc8150e745">Apps und Browser erreichen die Installation nur über Caddy, auf den Ports 80 und 443. Caddy leitet /v1, /platform, den MCP-Server und seine OAuth-Anmeldung an das Gateway und alle anderen Pfade an die Konsole weiter. PostgreSQL, ClickHouse und Valkey liegen in einem internen Netzwerk, das nur das Gateway erreicht, und das Gateway ruft die Modellanbieter über HTTPS auf.</desc><g><marker id="ddfd6bcfc8150e745_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="ddfd6bcfc8150e745_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="ddfd6bcfc8150e745_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="ddfd6bcfc8150e745_flowchart-v2-pointS