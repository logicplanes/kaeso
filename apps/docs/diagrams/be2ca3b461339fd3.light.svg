<svg id="dbe2ca3b461339fd3" width="930" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="423" viewBox="4 12 929.37 422.91" role="img" aria-describedby="chart-desc-dbe2ca3b461339fd3" aria-labelledby="chart-title-dbe2ca3b461339fd3" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter"><title id="chart-title-dbe2ca3b461339fd3">实例如何得知新版本并完成更新</title><desc id="chart-desc-dbe2ca3b461339fd3">网关向 update.kaeso.app 查询新版本，把状态保存在 PostgreSQL 中，并通过内部网络 updates 用 bearer 令牌请求更新器。更新器从 github.com 获取 release.json 和 compose.yaml，从 api.github.com 获取证明，从 ghcr.io 获取镜像，只通过内部网络 docker 上的 docker-proxy 访问 Docker，并写入维护标志，Caddy 读取该标志来提供更新页面和 JSON 503。</desc><g><marker id="dbe2ca3b461339fd3_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="dbe2ca3b461339fd3_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="dbe2ca3b461339fd3_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="dbe2ca3b461339fd3_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(1