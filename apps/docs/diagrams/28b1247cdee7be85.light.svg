<svg id="d28b1247cdee7be85" width="650" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="177" viewBox="4 12 649.03 176.8" role="img" aria-describedby="chart-desc-d28b1247cdee7be85" aria-labelledby="chart-title-d28b1247cdee7be85" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.463"><title id="chart-title-d28b1247cdee7be85">Die Spans einer Modellanfrage</title><desc id="chart-desc-d28b1247cdee7be85">Der Span der App, den der Header traceparent nennt, ist der Elternteil von Kaesos Server-Span kaeso.request. Darunter liegt für jeden Schritt, der einen Anbieter aufrief, ein Client-Span, in der Reihenfolge der Versuche: hier ein Schritt, dessen Modell überlastet war, dann der Schritt, der mit einem anderen Modell antwortete und die Tokens und den Inhalt trägt.</desc><g><marker id="d28b1247cdee7be85_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d28b1247cdee7be85_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d28b1247cdee7be85_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="d28b1247cdee7be85_flowchart-v2-pointStart-margin" viewB