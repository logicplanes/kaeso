<svg id="dbb74c04f3dd9dccf" width="701" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="708" viewBox="4 12 700.77 707.18" role="img" aria-describedby="chart-desc-dbb74c04f3dd9dccf" aria-labelledby="chart-title-dbb74c04f3dd9dccf" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.149"><title id="chart-title-dbb74c04f3dd9dccf">实例如何得知新版本并完成更新</title><desc id="chart-desc-dbb74c04f3dd9dccf">网关从 update.kaeso.app 获取版本列表，把更新状态保存在 PostgreSQL 中，并通过内部网络 updates 用 bearer 令牌让更新器开始更新。更新器从 github.com 获取 release.json 和 compose.yaml，从 api.github.com 获取证明，从 ghcr.io 获取镜像。它只通过内部网络 docker 上的 docker-proxy 访问 Docker 套接字；它启动的 compose 运行器也是如此，运行器以只读方式读取实例文件夹并运行 Docker Compose。更新器写入维护标志，Caddy 读取该标志来提供更新页面和 JSON 503。</desc><g><marker id="dbb74c04f3dd9dccf_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><polygon points="0,7 11.5,14 11.5,0" stroke-width="0px"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-circleEnd" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-circleStart" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-circleEnd-margin" viewBox="0 0 10 10" refY="5" refX="12.25" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5" stroke-width="0px"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-circleStart-margin" viewBox="0 0 10 10" refX="-2" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><circle cx="5" cy="5" r="5" stroke-width="0px"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-crossEnd" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 1,1 l 9,9 M 10,1 l -9,9" stroke-width="2px"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-crossStart" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 1,1 l 9,9 M 10,1 l -9,9" stroke-width="2px"/></marker><marker id="dbb74c04f3dd9dccf_flowchart-v2-crossEnd-margin" viewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" marke