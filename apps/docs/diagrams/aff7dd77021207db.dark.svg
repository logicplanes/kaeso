<svg id="daff7dd77021207db" width="1179" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="497" viewBox="4 -4 1178.73 496.63" role="img" aria-describedby="chart-desc-daff7dd77021207db" aria-labelledby="chart-title-daff7dd77021207db" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.683"><title id="chart-title-daff7dd77021207db">Kaeso auf einer verwalteten Plattform</title><desc id="chart-desc-daff7dd77021207db">Apps und Browser erreichen einen öffentlichen Edge über das TLS der Plattform. Der Edge sendet die APIs, den MCP-Server und seine Anmeldung an ein privates Gateway und jeden anderen Pfad an eine private Konsole. Das Gateway nutzt PostgreSQL und Valkey der Plattform, ein externes ClickHouse, wenn Anfrageprotokolle an sind, und ruft die Modellanbieter auf.</desc><g><marker id="daff7dd77021207db_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="daff7dd77021207db_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="daff7dd77021207db_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="daff7dd77021207db_flowchart-v2-pointStart-margin