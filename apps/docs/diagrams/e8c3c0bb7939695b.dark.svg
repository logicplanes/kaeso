<svg id="de8c3c0bb7939695b" width="1250" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="351" viewBox="4 -4 1250 350.1" role="img" aria-describedby="chart-desc-de8c3c0bb7939695b" aria-labelledby="chart-title-de8c3c0bb7939695b" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.682"><title id="chart-title-de8c3c0bb7939695b">Kaeso on Kubernetes</title><desc id="chart-desc-de8c3c0bb7939695b">Apps and browsers reach the cluster's Ingress or Gateway over TLS. It sends the APIs, the MCP server and its sign-in to the gateway Deployment and every other path to the console Deployment. A migration Job runs before each install and upgrade reaches the gateways. The gateways use PostgreSQL, Valkey and ClickHouse, which you bring or the chart bundles, call the model providers, and Prometheus scrapes their metrics Service.</desc><g><marker id="de8c3c0bb7939695b_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="de8c3c0bb7939695b_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="de8c3c0bb7939695b_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id=