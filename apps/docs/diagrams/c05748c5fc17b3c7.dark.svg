<svg id="dc05748c5fc17b3c7" width="568" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="611" viewBox="4 12 567.37 610.18" role="img" aria-describedby="chart-desc-dc05748c5fc17b3c7" aria-labelledby="chart-title-dc05748c5fc17b3c7" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(250, 250, 250)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter"><title id="chart-title-dc05748c5fc17b3c7">实例如何得知新版本并完成更新</title><desc id="chart-desc-dc05748c5fc17b3c7">网关从 update.kaeso.app 获取版本列表，把更新状态保存在 PostgreSQL 中，并通过内部网络 updates 用 bearer 令牌让更新器开始更新。更新器从 github.com 获取 release.json 和 compose.yaml，从 api.github.com 获取证明，从 ghcr.io 获取镜像。它只通过内部网络 docker 上的 docker-proxy 访问 Docker 套接字，并写入维护标志，Caddy 读取该标志来提供更新页面和 JSON 503。</desc><g><marker id="dc05748c5fc17b3c7_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><polygon points="0,7 11.5,14 11.5,0" stroke-width="0px"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-circleEnd" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><circle cx="5" cy="5" r="5"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-circleStart" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><circle cx="5" cy="5" r="5"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-circleEnd-margin" viewBox="0 0 10 10" refY="5" refX="12.25" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><circle cx="5" cy="5" r="5" stroke-width="0px"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-circleStart-margin" viewBox="0 0 10 10" refX="-2" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><circle cx="5" cy="5" r="5" stroke-width="0px"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-crossEnd" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 1,1 l 9,9 M 10,1 l -9,9" stroke-width="2px"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-crossStart" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 1,1 l 9,9 M 10,1 l -9,9" stroke-width="2px"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-crossEnd-margin" viewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 1,1 L 14,14 M 1,14 L 14,1" stroke-width="2.5px"/></marker><marker id="dc05748c5fc17b3c7_flowchart-v2-crossStart-margin" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto" fill="rgb(117, 117, 117)" stroke="rgb(117, 117, 117)"><path d="M 1,1 L 14,14 M 1,14 L 14,1" stroke-width="2.5px"/></marker><g><g><g id="dc05748c5fc17b3c7-server"><rect x="8" y="116" width="419.7" height="502.18" fill="none" stroke="rgb(51, 51, 51)" stroke-dasharray="4px, 4px" rx="10" ry="10"/></g></g><g><path d="M108.5,65L108.5,70.58C108.5,76.17,108.5,87.33,108.5,98.5C108.5,109.67,108.5,120.83,108.5,129.75C108.5,138.67,108.5,145.33,108.5,148.67L108.5,152" id="dc05748c5fc17b3c7-L_feed_gateway_0" marker-end="url(#dc05748c5fc17b3c7_flowchart-v2-pointEnd)" fill="none" stroke="rgb(117, 117, 117)"/><path d="M99.68,205L97.27,211.68C94.87,218.37,90.05,231.73,87.65,244.43C85.24,257.13,85.24,269.17,85.24,275.18L85.24,281.2" id="dc05748c5fc17b3c7-L_gateway_postgres_0" marker-end="url(#dc05748c5fc17b3c7_flowchart-v2-pointEnd)" fill="none" stroke="rgb(117, 117, 117)"/><path d="M135.17,205L142.45,211.68C149.72,218.37,164.28,231.73,179.79,246.01C195.31,260.28,211.78,275.46,220.02,283.05L228.26,290.64" id="dc05748c5fc17b3c7-L_gateway_updater_0" marker-end="url(#dc05748c5fc17b3c7_flowchart-v2-pointEnd)" fill="none" stroke="rgb(117, 117, 117)"/><path d="M457.7,203.66L441.34,210.57C424.99,217.47,392.29,231.29,365.23,245.85C338.17,260.41,316.75,275.72,306.04,283.37L295.33,291.02" id="dc05748c5fc17b3c7-L_github_updater_0" marker-end="url(#dc05748c5fc17b3c7_flowchart-v2-pointEnd)" fill="none" stroke="rgb(117, 117, 117)"/><path d="M225.82,342.35L216.77,349.29C207.71,356.23,189.59,370.12,180.53,382.95C171.48,395.78,171.48,407.56,171.48,413.45L171.48,419.34" id="dc05748c5fc17b3c7-L_updater_proxy_0" marker-end="url(#dc05748c5fc17b3c7_flowchart-v2-pointEnd)" fill="none" stroke="rgb(117, 117, 117)"/><path d="M171.48,472.3