<svg id="da1d130c25ae4cb5f" width="1255" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="350" viewBox="4 -4 1254.47 349.12" role="img" aria-describedby="chart-desc-da1d130c25ae4cb5f" aria-labelledby="chart-title-da1d130c25ae4cb5f" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.69"><title id="chart-title-da1d130c25ae4cb5f">Kaeso auf Kubernetes</title><desc id="chart-desc-da1d130c25ae4cb5f">Apps und Browser erreichen das Ingress oder Gateway des Clusters über TLS. Es schickt die APIs, den MCP-Server und dessen Anmeldung an das Gateway-Deployment und jeden anderen Pfad an das Konsolen-Deployment. Ein Migrations-Job läuft, bevor jede Installation und jedes Upgrade die Gateways erreicht. Die Gateways nutzen PostgreSQL, Valkey und ClickHouse, die Sie mitbringen oder das Chart mitliefert, rufen die Modellanbieter auf, und Prometheus liest ihren Metrik-Service.</desc><g><marker id="da1d130c25ae4cb5f_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="da1d130c25ae4cb5f_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="da1d130c25ae4cb5f_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 11.5 7 L 0