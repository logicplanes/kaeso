<svg id="d8fedac702f0dfdd1" width="1154" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="497" viewBox="4 -4 1153.2 496.64" role="img" aria-describedby="chart-desc-d8fedac702f0dfdd1" aria-labelledby="chart-title-d8fedac702f0dfdd1" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" data-focus="0.672"><title id="chart-title-d8fedac702f0dfdd1">Kaeso on a managed platform</title><desc id="chart-desc-d8fedac702f0dfdd1">Apps and browsers reach a public edge over the platform's TLS. The edge sends the APIs, the MCP server and its sign-in to a private gateway and every other path to a private console. The gateway uses the platform's PostgreSQL and Valkey, an external ClickHouse when request logs are on, and calls the model providers.</desc><g><marker id="d8fedac702f0dfdd1_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d8fedac702f0dfdd1_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d8fedac702f0dfdd1_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="d8fedac702f0dfdd1_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits