, 163)"><path d="M 1,1 L 14,14 M 1,14 L 14,1" stroke-width="2.5px"/></marker><marker id="de92f4477c3ff9f6e_flowchart-v2-crossStart-margin" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto" fill="rgb(163, 163, 163)" stroke="rgb(163, 163, 163)"><path d="M 1,1 L 14,14 M 1,14 L 14,1" stroke-width="2.5px"/></marker><g><g/><g><path d="M81.76,94.76L100.88,83.72C119.99,72.67,158.22,50.59,195.31,39.54C232.41,28.5,268.37,28.5,286.35,28.5L304.33,28.5" id="de92f4477c3ff9f6e-L_gateway_releases_0" marker-end="url(#de92f4477c3ff9f6e_flowchart-v2-pointEnd)" fill="none" stroke="rgb(163, 163, 163)"/><path d="M84.56,115.26L103.21,115.26C121.86,115.26,159.15,115.26,200.95,115.26C242.74,115.26,289.03,115.26,312.18,115.26L335.33,115.26" id="de92f4477c3ff9f6e-L_gateway_postgres_0" marker-end="url(#de92f4477c3ff9f6e_flowchart-v2-pointEnd)" fill="none" stroke="rgb(163, 163, 163)"/><path d="M81.76,135.76L100.88,146.8C119.99,157.84,158.22,179.93,200.45,190.97C242.68,202.02,288.91,202.02,312.03,202.02L335.15,202.02" id="de92f4477c3ff9f6e-L_gateway_updater_0" marker-end="url(#de92f4477c3ff9f6e_flowchart-v2-pointEnd)" fill="none" stroke="rgb(163, 163, 163)"/><path d="M410.59,181.52L438.85,159.26C467.1,137,523.6,92.49,573.06,70.23C622.52,47.97,664.93,47.97,686.13,47.97L707.34,47.97" id="de92f4477c3ff9f6e-L_updater_github_0" marker-end="url(#de92f4477c3ff9f6e_flowchart-v2-pointEnd)" fill="none" stroke="rgb(163, 163, 163)"/><path d="M429.99,184.12L455.01,174.27C480.03,164.41,530.07,144.7,574.31,134.85C618.54,124.99,656.97,124.99,676.19,124.99L695.41,124.99" id="de92f4477c3ff9f6e-L_updater_api_0" marker-end="url(#de92f4477c3ff9f6e_flowchart-v2-pointEnd)" fill="none" stroke="rgb(163, 163, 163)"/><path d="M429.99,202.02L455.01,202.02C480.03,202.02,530.07,202.02,578.74,202.02C627.4,202.02,674.69,202.02,698.34,202.02L721.98,202.02" id="de92f4477c3ff9f6e-L_updater_ghcr_0" marker-end="url(#de92f4477c3ff9f6e_flowchart-v2-pointEnd)" fill