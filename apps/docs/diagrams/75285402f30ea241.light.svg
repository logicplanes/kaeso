<svg id="d75285402f30ea241" width="967" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="395" viewBox="4 4 966.68 394.49" role="img" aria-describedby="chart-desc-d75285402f30ea241" aria-labelledby="chart-title-d75285402f30ea241" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter"><title id="chart-title-d75285402f30ea241">Wie eine Installation von Releases erfährt und sich aktualisiert</title><desc id="chart-desc-d75285402f30ea241">Das Gateway fragt update.kaeso.app nach Releases ab, hält seinen Zustand in PostgreSQL und ruft den Updater über das interne Netz updates mit einem Bearer-Token auf. Der Updater holt release.json und compose.yaml von github.com, Attestierungen von api.github.com und Images von ghcr.io, erreicht Docker nur über docker-proxy im internen Netz docker und schreibt das Wartungs-Flag, das Caddy liest, um die Update-Seite und die JSON-503 auszuliefern.</desc><g><marker id="d75285402f30ea241_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(102, 102, 102)" stroke="rgb(102, 102, 102)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d75285402f30ea241_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(102, 102, 102)" stroke="rgb(102, 102, 102)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d75285402f30ea241_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(102, 102, 102)" stroke="rgb(102, 102, 102)"><path d="M 0 0 L 11.5 7 L 0 1