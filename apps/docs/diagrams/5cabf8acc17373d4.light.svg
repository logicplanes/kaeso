<svg id="d5cabf8acc17373d4" width="628" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="560" viewBox="4 12 627.55 559.88" role="img" aria-describedby="chart-desc-d5cabf8acc17373d4" aria-labelledby="chart-title-d5cabf8acc17373d4" font-family="&quot;Inter Variable&quot;, Inter, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="auto" fill="rgb(10, 10, 10)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter"><title id="chart-title-d5cabf8acc17373d4">The development stack</title><desc id="chart-desc-d5cabf8acc17373d4">Your browser opens Vite on localhost:3000, which serves the console and sends /platform and /v1 on to the gateway on 127.0.0.1:18080. The gateway runs in the Compose project kaeso-dev with PostgreSQL, ClickHouse and Valkey, and calls the mock providers, the mock ChatGPT and Grok sign-in, the mock single sign-on, the mock releases and updater, and Mailpit.</desc><g><marker id="d5cabf8acc17373d4_flowchart-v2-pointEnd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="d5cabf8acc17373d4_flowchart-v2-pointStart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 5 L 10 10 L 10 0 z"/></marker><marker id="d5cabf8acc17373d4_flowchart-v2-pointEnd-margin" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto" fill="rgb(133, 133, 133)" stroke="rgb(133, 133, 133)"><path d="M 0 0 L 11.5 7 L 0 14 z" stroke-width="0px"/></marker><marker id="d5cabf8acc17373d4_flowchart-v2-pointStart-margin" viewBox="0 0 11.5 14" refX="1" refY="