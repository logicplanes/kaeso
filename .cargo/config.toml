[alias]
xtask = ["run", "--quiet", "--package", "xtask", "--"]
coverage-kpp = [
  "llvm-cov",
  "--package",
  "kaeso-kpp",
  "--package",
  "kaeso-codecs",
  "--all-features",
  "--ignore-filename-regex",
  "(/tests/|/tests_[a-z_]+\\.rs|/models_tests\\.rs|/test_support\\.rs)",
  # Was 95 until Rust 1.100, whose coverage counts the same code about 0.75 points lower.
  "--fail-under-lines",
  "94.25",
]
coverage-gateway = [
  "llvm-cov",
  "nextest",
  "--no-fail-fast",
  "--workspace",
  "--exclude",
  "kaeso-kpp",
  "--exclude",
  "kaeso-codecs",
  "--exclude",
  "kpp-conformance",
  "--exclude",
  "xtask",
  "--all-features",
  "--ignore-filename-regex",
  "(/tests/|/tests?\\.rs|/kaeso-testkit/|/kaeso-bench/|/kaeso/src/main\\.rs|/kaeso-server/src/telemetry\\.rs)",
  "--fail-under-lines",
  "91",
]
