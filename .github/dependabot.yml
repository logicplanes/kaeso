version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: cargo
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: rustup

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: pnpm
    groups:
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # A `select` that throws re-renders forever from 5.105.2 (TanStack/query#12532), fixed around 5.107.
      - dependency-name: "@tanstack/react-query"
        versions:
          - ">=5.105.2 <5.107.0"
      # 6.44.1 reports the lazily loaded sidebar menus as unused; 6.45.0 fixes it (webpro-nl/knip#2336).
      - dependency-name: knip
        versions:
          - "6.44.1"

  - package-ecosystem: pip
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - python
    commit-message:
      prefix: pip
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /deploy
      - /.oss-scanner
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: docker
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /e2e/install
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: compose
    groups:
      compose-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: logicplanes/kaeso-*
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: clickhouse/clickhouse-server
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: actions
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
