version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: cargo
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: pnpm
    groups:
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - python
    commit-message:
      prefix: pip
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: docker
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /e2e/install
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: compose
    groups:
      compose-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: clickhouse/clickhouse-server
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: actions
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
