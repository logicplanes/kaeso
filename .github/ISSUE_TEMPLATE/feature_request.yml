name: Feature request
description: Suggest a new capability, a change to an existing one, or something the documentation should explain.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How Kaeso could solve it. Link the provider documentation or OpenAPI schema for any wire field involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, or what you do today.
