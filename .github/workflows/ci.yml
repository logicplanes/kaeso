name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      all:
        description: Run every job, whatever changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SQLX_OFFLINE: "true"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.workflows == 'true' }}
      kpp: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.kpp == 'true' || steps.filter.outputs.workflows == 'true' }}
      node: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.node == 'true' || steps.filter.outputs.workflows == 'true' }}
      deploy: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.deploy == 'true' || steps.filter.outputs.workflows == 'true' }}
      repository: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.repository == 'true' || steps.filter.outputs.workflows == 'true' }}
      workflows: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request' && !inputs.all
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            rust:
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - clippy.toml
              - deny.toml
              - .cargo/**
              - .sqlx/**
              - openapi.json
              - crates/**
              - apps/docs/content/*/concepts/supported-providers.md
              - fuzz/**
              - e2e/**
              - deploy/compose.dev.yaml
              - deploy/compose.yaml
            kpp:
              - Cargo.lock
              - rust-toolchain.toml
              - crates/kaeso-kpp/**
              - crates/kaeso-codecs/**
              - fuzz/**
            node:
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .node-version
              - .prettierrc.json
              - .prettierignore
              - tsconfig.base.json
              - knip.json
              - openapi.json
              - CHANGELOG.md
              - .github/labeler.yml
              - scripts/**
              - apps/**
              - packages/**
            deploy:
              - deploy/**
              - e2e/install/**
            repository:
              - "*.md"
              - LICENSE
              - deploy/**/*.md
              - .github/**
              - .editorconfig
              - .gitattributes
              - .gitignore
            workflows:
              - .github/workflows/**
      - name: Areas
        env:
          RUST: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.rust == 'true' }}
          KPP: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.kpp == 'true' }}
          NODE: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.node == 'true' }}
          DEPLOY: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.deploy == 'true' }}
          REPOSITORY: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.repository == 'true' }}
          WORKFLOWS: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.workflows == 'true' }}
        run: |
          {
            echo "| Area | Changed |"
            echo "| --- | --- |"
            echo "| Rust | $RUST |"
            echo "| KPP | $KPP |"
            echo "| TypeScript | $NODE |"
            echo "| Deployment | $DEPLOY |"
            echo "| Repository | $REPOSITORY |"
            echo "| Workflows | $WORKFLOWS |"
          } >> "$GITHUB_STEP_SUMMARY"

  comments:
    name: Comments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Comments hold no to-do notes
        run: |
          if git grep -nIP '(//|/\*|\*|#|--|<!--)\s*(TODO|FIXME|XXX|HACK)\b' -- ':!CHANGELOG.md' ':!*.lock' ':!pnpm-lock.yaml'; then
            echo "::error::Open an issue instead of leaving a TODO, FIXME, XXX or HACK note in a comment."
            exit 1
          fi
      - name: Code blocks in Markdown contain no comments
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const { readFileSync } = require("node:fs");
            const files = execFileSync("git", ["ls-files", "--", "*.md", "*.mdx"], { encoding: "utf8" }).split("\n").filter(Boolean);
            const hashed = ["bash", "sh", "shell", "console", "yaml", "yml", "toml", "python", "py", "dockerfile", ""];
            let found = 0;
            for (const file of files) {
              let lang = null;
              readFileSync(file, "utf8").split("\n").forEach((line, i) => {
                const text = line.trim();
                if (text.startsWith("```")) {
                  lang = lang === null ? text.slice(3).split(/\s/)[0] : null;
                  return;
                }
                if (lang === null) return;
                const hash = hashed.includes(lang) && text.startsWith("#") && !text.startsWith("#!");
                if (hash || text.startsWith("//") || text.startsWith("/*") || text.startsWith("<!--")) {
                  console.log("::error file=" + file + ",line=" + (i + 1) + "::A comment in a code block: explain it in the text instead.");
                  found++;
                }
              });
            }
            process.exit(found ? 1 : 0);
          '

  workflows:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  rust-format:
    name: Rust format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml

  rust-lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            fuzz
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets

  test-kpp:
    name: Test KPP
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-llvm-cov
      - run: cargo coverage-kpp
      - run: cargo test --doc -p kaeso-kpp -p kaeso-codecs --all-features
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### KPP line coverage"
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex '(/tests/|/tests_[a-z_]+\.rs|/models_tests\.rs|/test_support\.rs)' | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Minimum Rust version (${{ matrix.crate }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [kaeso-kpp, kaeso-codecs]
    env:
      CRATE: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the crate's minimum Rust version
        run: |
          set -euo pipefail
          version="$(cargo +stable metadata --no-deps --format-version 1 | jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .rust_version // empty')"
          if [[ -z "$version" ]]; then
            echo "::error::$CRATE has no rust-version in its Cargo.toml."
            exit 1
          fi
          rustup toolchain install "$version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          echo "$CRATE is checked with Rust $version." >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo check --locked -p "$CRATE" --all-features
      - run: cargo test --locked -p "$CRATE" --all-features

  published-crates:
    name: Published crates
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRATES: -p kaeso-kpp -p kaeso-codecs
      BASE: ${{ github.event.pull_request.base.sha }}
      BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: published-crates
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-semver-checks
      - name: Both crates package and would publish
        run: |
          read -ra crates <<< "$CRATES"
          cargo publish --dry-run --locked "${crates[@]}"
      - name: Their documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          read -ra crates <<< "$CRATES"
          cargo doc --no-deps --locked --all-features "${crates[@]}"
      - name: Their API changes fit a minor release after the last published version
        run: |
          read -ra crates <<< "$CRATES"
          cargo semver-checks "${crates[@]}" --release-type minor
      - name: A pull request changes their API only in ways a patch release allows, unless it is labelled breaking
        if: github.event_name == 'pull_request'
        run: |
          read -ra crates <<< "$CRATES"
          if [[ "$BREAKING" == true ]]; then
            echo "Labelled \`breaking\`, so the published crates' API may break." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! cargo semver-checks "${crates[@]}" --baseline-rev "$BASE" --release-type patch; then
            echo "::error::This pull request breaks the API of kaeso-kpp or kaeso-codecs. Make the change additive, or label the pull request breaking so the changelog names it."
            exit 1
          fi

  fuzz-runs:
    name: Fuzz runs
    needs: changes
    if: needs.changes.outputs.kpp == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fuzz.yml
    with:
      seconds: 60

  test-gateway:
    name: Test gateway
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pull the development stack while the toolchain installs
        run: nohup docker compose -f deploy/compose.dev.yaml pull --quiet > "$RUNNER_TEMP/pull.log" 2>&1 &
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: docker compose -f deploy/compose.dev.yaml up -d --wait
      - run: cargo coverage-gateway
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Gateway line coverage"
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex '(/tests/|/tests?\.rs|/kaeso-testkit/|/kaeso-bench/|/kaeso/src/main\.rs|/kaeso-server/src/telemetry\.rs|/crates/kaeso-kpp/|/crates/kaeso-codecs/|/crates/kpp-conformance/|/crates/xtask/)' | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  repository-tooling:
    name: Repository tooling
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Every file states the version only where the release sets it
        run: node scripts/version.mjs check
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo test -p xtask -p kpp-conformance
      - run: cargo test -p kaeso-server --test docs_paths

  query-data:
    name: Query data
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://kaeso:kaeso@127.0.0.1:55432/kaeso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pull PostgreSQL while the toolchain installs
        run: nohup docker compose -f deploy/compose.dev.yaml pull --quiet postgres > "$RUNNER_TEMP/pull.log" 2>&1 &
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: sqlx-cli
      - run: docker compose -f deploy/compose.dev.yaml up -d --wait postgres
      - run: cargo sqlx migrate run --source crates/kaeso-store/migrations/postgres
      - run: cargo sqlx prepare --workspace --check

  openapi:
    name: OpenAPI document
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: openapi
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo run -q -p kaeso -- openapi | diff - openapi.json

  rust-dependencies:
    name: Rust dependencies
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: crates/kaeso-codecs/Cargo.toml
          command: check

  fuzz:
    name: Fuzz targets
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  sdk-conformance:
    name: SDK conformance
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pip install --require-hashes -r e2e/requirements.txt
      - run: pytest -q e2e/conformance

  sdk-e2e:
    name: SDK end-to-end
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pull the development stack while the toolchain installs
        run: nohup docker compose -f deploy/compose.dev.yaml pull --quiet > "$RUNNER_TEMP/pull.log" 2>&1 &
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pip install --require-hashes -r e2e/requirements.txt
      - run: docker compose -f deploy/compose.dev.yaml up -d --wait
      - run: pytest -q e2e/sdk

  compose:
    name: Compose config
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: The self-hosting package is valid
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env.example config -q
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_SUPERUSER_PASSWORD: ci
          CLICKHOUSE_PASSWORD: ci
          VALKEY_PASSWORD: ci
      - name: The development stack is valid
        run: docker compose -f deploy/compose.dev.yaml --profile console config -q

  image-gateway:
    name: Images (gateway)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: mkdir -p "$RUNNER_TEMP/images"
      - id: version
        name: Version of the gateway
        run: |
          set -euo pipefail
          echo "gateway=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kaeso") | .version')" >> "$GITHUB_OUTPUT"
      - name: Gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/gateway.Dockerfile
          target: gateway
          build-args: VERSION=${{ steps.version.outputs.gateway }}
          tags: kaeso-gateway:ci
          outputs: type=docker,dest=${{ runner.temp }}/images/gateway.tar
          cache-from: type=gha,scope=ci-gateway
          cache-to: ${{ github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=ci-gateway' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-gateway
          path: ${{ runner.temp }}/images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-mock:
    name: Images (mock provider)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: mkdir -p "$RUNNER_TEMP/images"
      - name: Mock provider image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/gateway.Dockerfile
          target: mock
          tags: kaeso-mock:ci
          outputs: type=docker,dest=${{ runner.temp }}/images/mock.tar
          cache-from: |
            type=gha,scope=ci-gateway
            type=gha,scope=ci-mock
          cache-to: ${{ github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=ci-mock' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-mock
          path: ${{ runner.temp }}/images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-updater:
    name: Images (updater)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: mkdir -p "$RUNNER_TEMP/images"
      - id: version
        name: Version of the gateway
        run: |
          set -euo pipefail
          echo "gateway=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kaeso") | .version')" >> "$GITHUB_OUTPUT"
      - name: Updater image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/updater.Dockerfile
          build-args: VERSION=${{ steps.version.outputs.gateway }}
          tags: kaeso-updater:ci
          outputs: type=docker,dest=${{ runner.temp }}/images/updater.tar
          cache-from: type=gha,scope=ci-updater
          cache-to: ${{ github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=ci-updater' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-updater
          path: ${{ runner.temp }}/images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-console:
    name: Images (console)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: mkdir -p "$RUNNER_TEMP/images"
      - id: version
        name: Version of the console
        run: echo "console=$(jq -r .version apps/console/package.json)" >> "$GITHUB_OUTPUT"
      - name: Console image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/console.Dockerfile
          build-args: VERSION=${{ steps.version.outputs.console }}
          tags: kaeso-console:ci
          outputs: type=docker,dest=${{ runner.temp }}/images/console.tar
          cache-from: type=gha,scope=ci-console
          cache-to: ${{ github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=ci-console' || '' }}
      - name: The console image serves the console
        run: |
          docker load --input "$RUNNER_TEMP/images/console.tar"
          docker run --detach --name console --publish 127.0.0.1:3000:3000 kaeso-console:ci
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:3000/healthz >/dev/null && break; sleep 1; done
          test "$(curl -fsS http://127.0.0.1:3000/healthz)" = ok
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/missing.js)" = 404
          docker rm --force console
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-console
          path: ${{ runner.temp }}/images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  install:
    name: Install test
    needs: [changes, image-gateway, image-mock, image-updater, image-console]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAESO_TEST_GATEWAY_IMAGE: kaeso-gateway:ci
      KAESO_TEST_MOCK_IMAGE: kaeso-mock:ci
      KAESO_TEST_CONSOLE_IMAGE: kaeso-console:ci
      KAESO_TEST_UPDATER_IMAGE: kaeso-updater:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - run: for image in "$RUNNER_TEMP"/images/*.tar; do docker load --input "$image"; done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pip install --require-hashes -r e2e/requirements.txt
      - run: pytest -q e2e/install

  node-lint:
    name: TypeScript lint
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm --filter kaeso-console generate
      - run: pnpm lint
      - run: pnpm i18n
      - run: pnpm knip

  node-typecheck:
    name: TypeScript typecheck
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm typecheck

  libraries:
    name: TypeScript libraries
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build:packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libraries
          path: |
            packages/tokens/dist
            packages/ui/dist
            packages/ui/ai
          if-no-files-found: error
          retention-days: 1

  node-test:
    name: TypeScript test (${{ matrix.suite }})
    needs: [changes, libraries]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: tokens
            dir: packages/tokens
            command: pnpm --filter @logicplanes/kaeso-tokens test
          - suite: ui
            dir: packages/ui
            command: pnpm --filter @logicplanes/kaeso-ui test
          - suite: docs
            dir: apps/docs
            command: pnpm --filter kaeso-docs test
            chromium: true
          - suite: showcase
            dir: apps/showcase
            command: pnpm --filter kaeso-showcase test
          - suite: scripts
            dir: scripts
            command: node --test 'scripts/*.test.mjs'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - id: playwright
        if: matrix.chromium
        name: Playwright version
        run: echo "version=$(pnpm --filter kaeso-docs exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - if: matrix.chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: matrix.chromium
        run: pnpm --filter kaeso-docs exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: libraries
          path: packages
      - run: ${{ matrix.command }}
      - name: Coverage summary
        if: always()
        env:
          DIR: ${{ matrix.dir }}
        run: |
          file="$DIR/coverage/coverage-summary.json"
          if [[ -f "$file" ]]; then
            {
              echo "### TypeScript coverage"
              echo "| Package | Lines | Statements | Branches | Functions |"
              echo "| --- | ---: | ---: | ---: | ---: |"
              node -e 'const t = require(process.argv[1]).total; console.log(["", process.argv[2], ...["lines", "statements", "branches", "functions"].map((k) => t[k].pct + "%"), ""].join(" | ").trim())' "$PWD/$file" "$DIR"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  node-test-console:
    name: TypeScript test (console ${{ matrix.shard }}/6)
    needs: [changes, libraries]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: libraries
          path: packages
      - run: pnpm --filter kaeso-console generate
      - name: A sixth of the tests, recording their coverage for TypeScript test (console coverage)
        run: pnpm --filter kaeso-console exec vitest run --coverage --coverage.thresholds=false --shard="$SHARD/6" --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/vitest/blob-$SHARD.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vitest-console-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest
          if-no-files-found: error
          retention-days: 1

  node-coverage-console:
    name: TypeScript test (console coverage)
    needs: [changes, node-test-console]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: vitest-console-*
          merge-multiple: true
          path: ${{ runner.temp }}/vitest
      - name: Every test of the six shards passed, and their coverage meets the console's thresholds
        run: pnpm --filter kaeso-console exec vitest run --merge-reports="$RUNNER_TEMP/vitest" --coverage
      - name: Coverage summary
        if: always()
        run: |
          file="apps/console/coverage/coverage-summary.json"
          if [[ -f "$file" ]]; then
            {
              echo "### TypeScript coverage"
              echo "| Package | Lines | Statements | Branches | Functions |"
              echo "| --- | ---: | ---: | ---: | ---: |"
              node -e 'const t = require(process.argv[1]).total; console.log(["", "apps/console", ...["lines", "statements", "branches", "functions"].map((k) => t[k].pct + "%"), ""].join(" | ").trim())' "$PWD/$file"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  node-build:
    name: TypeScript build
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: pnpm licenses:check
      - run: pnpm release:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: showcase
          path: apps/showcase/dist
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs
          path: apps/docs/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  e2e-console:
    name: End-to-end console (${{ matrix.part }}/5)
    needs: [changes, libraries, image-gateway]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    env:
      KAESO_GATEWAY_IMAGE: kaeso-gateway:ci
      PART: ${{ matrix.part }}
      PART_1: 02-models 03-keys 04-members 05-limits 06-logs 08-palette 13-keyboard
      PART_2: 02-models 04-members 10-org 11-instance
      PART_3: 02-models 04-members 12-lifecycle 19-roles
      PART_4: 09-account 14-sso 15-project-switch 16-period 17-playground 18-accounts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pull the stack's images while the job sets up
        run: nohup docker compose -f deploy/compose.dev.yaml --profile console --profile sso pull --quiet --ignore-buildable > "$RUNNER_TEMP/pull.log" 2>&1 &
      - id: specs
        name: The specs of this part, after 01-public on a stack of its own
        working-directory: apps/console
        run: |
          set -euo pipefail
          named="$PART_1 $PART_2 $PART_3 $PART_4"
          for name in $named; do
            if [[ ! -f "e2e/$name.spec.ts" ]]; then
              echo "::error::e2e/$name.spec.ts is named in PART_1, PART_2, PART_3 or PART_4 but doesn't exist."
              exit 1
            fi
          done
          case "$PART" in
            1) names="$PART_1" ;;
            2) names="$PART_2" ;;
            3) names="$PART_3" ;;
            4) names="$PART_4" ;;
            *) names="$(for file in e2e/*.spec.ts; do name="$(basename "$file" .spec.ts)"; [[ "$name" == 01-public || " $named " == *" $name "* ]] || echo "$name"; done)" ;;
          esac
          specs="e2e/01-public.spec.ts"
          for name in $names; do specs="$specs e2e/$name.spec.ts"; done
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "Part $PART runs \`$specs\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: image-gateway
          path: ${{ runner.temp }}/images
      - run: docker load --input "$RUNNER_TEMP/images/gateway.tar"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: libraries
          path: packages
      - id: playwright
        name: Playwright version
        run: echo "version=$(pnpm --filter kaeso-console exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm --filter kaeso-console exec playwright install --with-deps chromium
      - run: pnpm --filter kaeso-console generate
      - name: Playwright
        env:
          SPECS: ${{ steps.specs.outputs.specs }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: console-${{ matrix.part }}.zip
        run: |
          read -ra specs <<< "$SPECS"
          pnpm --filter kaeso-console exec playwright test "${specs[@]}" --reporter=list,blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: blob-console-${{ matrix.part }}
          path: ${{ runner.temp }}/blob-report
          if-no-files-found: ignore
          retention-days: 1

  e2e-console-report:
    name: End-to-end console report
    needs: e2e-console
    if: always() && needs.e2e-console.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline --filter kaeso-console
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: blob-console-*
          merge-multiple: true
          path: ${{ runner.temp }}/blob-report
      - name: One HTML report of every part
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/playwright-report
        run: pnpm --filter kaeso-console exec playwright merge-reports --reporter html "$RUNNER_TEMP/blob-report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-console
          path: ${{ runner.temp }}/playwright-report
          if-no-files-found: error
          retention-days: 7

  e2e-docs:
    name: End-to-end docs
    needs: [changes, libraries]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: libraries
          path: packages
      - id: playwright
        name: Playwright version
        run: echo "version=$(pnpm --filter kaeso-docs exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm --filter kaeso-docs exec playwright install --with-deps chromium
      - run: pnpm --filter kaeso-docs e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-docs
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          retention-days: 7

  e2e-showcase:
    name: End-to-end showcase (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, libraries, node-build]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    # Installing WebKit system packages from the runner's Ubuntu mirror alone has taken over 20 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, a11y]
        shards: [5]
        shard: [1, 2, 3, 4, 5]
        include:
          - project: chromium
            browser: chromium
          - project: a11y
            browser: chromium
          - project: webkit
            browser: webkit
            shards: 1
            shard: 1
    env:
      PROJECT: ${{ matrix.project }}
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: libraries
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: showcase
          path: apps/showcase/dist
      - id: playwright
        name: Playwright version
        run: echo "version=$(pnpm --filter kaeso-showcase exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - run: pnpm --filter kaeso-showcase exec playwright install --with-deps "$BROWSER"
      - name: Playwright
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: showcase-${{ matrix.project }}-${{ matrix.shard }}.zip
        run: pnpm --filter kaeso-showcase exec playwright test --project="$PROJECT" --shard="$SHARD" --reporter=list,github,blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: blob-showcase-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/blob-report
          if-no-files-found: ignore
          retention-days: 1

  e2e-showcase-report:
    name: End-to-end showcase report
    needs: e2e-showcase
    if: always() && needs.e2e-showcase.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline --filter kaeso-showcase
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: blob-showcase-*
          merge-multiple: true
          path: ${{ runner.temp }}/blob-report
      - name: One HTML report of every shard
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/playwright-report
        run: pnpm --filter kaeso-showcase exec playwright merge-reports --reporter html "$RUNNER_TEMP/blob-report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-showcase
          path: ${{ runner.temp }}/playwright-report
          if-no-files-found: error
          retention-days: 7

  node-dependencies:
    name: TypeScript dependencies
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm audit --prod --audit-level high

  ci:
    name: CI
    if: always()
    needs:
      - changes
      - comments
      - workflows
      - rust-format
      - rust-lint
      - test-kpp
      - msrv
      - test-gateway
      - repository-tooling
      - query-data
      - openapi
      - rust-dependencies
      - fuzz
      - published-crates
      - fuzz-runs
      - sdk-conformance
      - sdk-e2e
      - compose
      - image-gateway
      - image-mock
      - image-updater
      - image-console
      - install
      - node-lint
      - node-typecheck
      - libraries
      - node-test
      - node-test-console
      - node-coverage-console
      - node-build
      - e2e-console
      - e2e-docs
      - e2e-showcase
      - node-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every needed job passed or was skipped for an unchanged area
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.result == "success" and .comments.result == "success" and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' <<< "$NEEDS" > /dev/null
