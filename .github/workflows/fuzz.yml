name: Fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        type: number
        default: 600
  workflow_call:
    inputs:
      seconds:
        description: Seconds to run each target
        type: number
        default: 30
      shards:
        description: Jobs that share the targets, each running its targets one after another
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: ${{ !inputs.shards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            decode_anthropic_messages,
            decode_dashscope,
            decode_elevenlabs,
            decode_gemini,
            decode_gemini_embeddings,
            decode_gemini_interactions,
            decode_minimax_images,
            decode_minimax_speech,
            decode_minimax_videos,
            decode_openai_chat,
            decode_openai_embeddings,
            decode_openai_images,
            decode_openai_responses,
            decode_openai_speech,
            decode_openai_transcriptions,
            decode_openai_videos,
            decode_openrouter_videos,
            decode_veo,
            decode_xai_videos,
            decode_zai_videos,
            mcp,
            sse,
          ]
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || 600 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Every target in fuzz/Cargo.toml runs
        run: |
          set -euo pipefail
          listed="$(sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -vx kpp-fuzz | sort | paste -sd ' ' -)"
          if [[ "$listed" != "decode_anthropic_messages decode_dashscope decode_elevenlabs decode_gemini decode_gemini_embeddings decode_gemini_interactions decode_minimax_images decode_minimax_speech decode_minimax_videos decode_openai_chat decode_openai_embeddings decode_openai_images decode_openai_responses decode_openai_speech decode_openai_transcriptions decode_openai_videos decode_openrouter_videos decode_veo decode_xai_videos decode_zai_videos mcp sse" ]]; then
            echo "::error::fuzz/Cargo.toml has the targets $listed; list each one in the matrix of .github/workflows/fuzz.yml."
            exit 1
          fi
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-fuzz
      - name: Run the target with the fixtures as its seed corpus
        run: |
          set -euo pipefail
          seed=crates/kaeso-codecs/fixtures
          if [[ "$FUZZ_TARGET" == decode_* ]]; then seed="$seed/${FUZZ_TARGET#decode_}"; fi
          if [[ "$FUZZ_TARGET" == mcp ]]; then seed=crates/kaeso-mcp/fixtures; fi
          mkdir -p "fuzz/corpus/$FUZZ_TARGET"
          host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          cargo +nightly fuzz run --target "$host" "$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET" "$seed" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -max_len=65536
          echo "\`$FUZZ_TARGET\` ran for $SECONDS_PER_TARGET seconds without a crash." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  # CI shares the targets among a few jobs: one build each instead of one per target, and fewer runners waiting.
  fuzz-shards:
    name: Fuzz (${{ matrix.shard }}/${{ inputs.shards }})
    if: ${{ inputs.shards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards }}
      SECONDS_PER_TARGET: ${{ inputs.seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: The matrix has a job for every shard, and the nightly matrix lists every target
        run: |
          if [[ "$SHARDS" != 4 ]]; then
            echo "::error::The matrix of fuzz-shards lists 4 shards; make it list $SHARDS."
            exit 1
          fi
          sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -vx kpp-fuzz | while read -r target; do
            if ! grep -qE "^ +$target,?$" .github/workflows/fuzz.yml; then
              echo "::error::fuzz/Cargo.toml has the target $target; list it in the matrix of the fuzz job in .github/workflows/fuzz.yml."
              exit 1
            fi
          done
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
          save-if: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-fuzz
      - name: Run this shard's targets with the fixtures as their seed corpus
        run: |
          set -euo pipefail
          host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          mapfile -t targets < <(sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -vx kpp-fuzz | sort | awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard - 1')
          for target in "${targets[@]}"; do
            seed=crates/kaeso-codecs/fixtures
            if [[ "$target" == decode_* ]]; then seed="$seed/${target#decode_}"; fi
            if [[ "$target" == mcp ]]; then seed=crates/kaeso-mcp/fixtures; fi
            mkdir -p "fuzz/corpus/$target"
            cargo +nightly fuzz run --target "$host" "$target" "fuzz/corpus/$target" "$seed" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -max_len=65536
            echo "\`$target\` ran for $SECONDS_PER_TARGET seconds without a crash." >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.shard }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
