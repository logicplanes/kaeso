"area: gateway":
  - changed-files:
      - any-glob-to-any-file:
          - crates/kaeso/**
          - crates/kaeso-core/**
          - crates/kaeso-crypto/**
          - crates/kaeso-mail/**
          - crates/kaeso-server/**
          - crates/kaeso-store/**
          - crates/kaeso-update/**
          - crates/kaeso-upstream/**
          - .sqlx/**
          - openapi.json

"area: kpp":
  - changed-files:
      - any-glob-to-any-file:
          - crates/kaeso-kpp/**
          - crates/kaeso-codecs/**

"area: console":
  - changed-files:
      - any-glob-to-any-file:
          - apps/console/**

"area: ui library":
  - changed-files:
      - any-glob-to-any-file:
          - packages/**
          - apps/showcase/**

"area: documentation":
  - changed-files:
      - any-glob-to-any-file:
          - apps/docs/**

"area: self-hosting":
  - changed-files:
      - any-glob-to-any-file:
          - crates/kaeso-updater/**
          - deploy/compose.yaml
          - deploy/kaeso.example.toml
          - deploy/*.Dockerfile
          - deploy/*.dockerignore
          - deploy/console/**

internal:
