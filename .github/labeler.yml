      - any-glob-to-all-files:
          - .github/**
          - .cargo/**
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
          - "**/*.test.ts"
          - "**/*.test.tsx"
          - "**/*.test.mjs"
          - "**/*.spec.ts"
          - "**/e2e/**"
          - "**/tests/**"
          - "**/fixtures/**"
          - "**/snapshots/**"
          - "**/benches/**"
          - "**/vitest.config.ts"
          - "**/playwright.config.ts"
          - "**/eslint.config.js"
          - "**/tsconfig*.json"
          - apps/docs/eslint/**
          - apps/docs/scripts/**
          - apps/showcase/scripts/**
          - crates/kaeso-testkit/**
          - crates/kpp-conformance/**
          - crates/xtask/**
          - fuzz/**
          - scripts/**
          - deploy/compose.dev.yaml
          - CHANGELOG.md
          - CONTRIBUTING.md
          - .editorconfig
          - .gitattributes
          - "**/.gitignore"
          - .node-version
          - .prettierignore
          - .prettierrc.json
          - clippy.toml
          - deny.toml
          - knip.json
          - rust-toolchain.toml
          - rustfmt.toml
